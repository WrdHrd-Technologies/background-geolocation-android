apply plugin: 'com.android.library'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

buildscript {
    repositories {
        google()
        mavenCentral() 
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2' 
    }
}

// CRITICAL FIX: This makes JitPack and MavenCentral visible to your dependencies below
repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 34)
    buildToolsVersion safeExtGet('buildToolsVersion', '34.0.0')

    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'

    defaultConfig {
        resValue "string", "account_name", 'Locations'
        resValue "string", "account_type", 'com.marianhello.account'
        resValue "string", "content_authority", 'com.marianhello.provider'
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 34) 
        
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "com.github.suman379:RealTime:master-SNAPSHOT"
    
    implementation "com.google.android.gms:play-services-location:${safeExtGet('playServicesLocationVersion', '21.2.0')}"
    
    implementation 'androidx.work:work-runtime:2.11.1'
    
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    implementation 'com.github.tony19:logback-android:2.0.0'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    
    implementation 'com.github.jparkie:promise:1.0.3'
    implementation('io.github.nishkarsh:android-permissions:0.1.7') {
        exclude group: 'com.android.support', module: 'appcompat-v7'
    }
}